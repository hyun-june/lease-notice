name: probe
on: [workflow_dispatch]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: SH board
        run: |
          code=$(curl -s -o sh.html -w '%{http_code}' --max-time 30 "https://www.i-sh.co.kr/app/lay2/program/S1T294C297/www/brd/m_247/list.do?multi_itm_seq=2" || echo FAIL)
          echo "SH_HTTP=$code SH_ROWS=$(grep -c "getDetailView('" sh.html || echo 0) SH_BYTES=$(wc -c < sh.html)"
      - name: LH proxy
        run: |
          code=$(curl -s -o lh.json -w '%{http_code}' --max-time 30 "https://k-skill-proxy.nomadamas.org/v1/lh-notice/search?pageSize=3" || echo FAIL)
          echo "LH_HTTP=$code LH_ITEMS=$(grep -o 'pan_id' lh.json | wc -l)"
