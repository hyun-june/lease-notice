name: notify

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 문법·설정 자체 검사
        run: for f in *.js api/*.js; do node --check "$f"; done && node lib.js

      - name: 공고 조회 및 알림 전송
        id: run
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: node notify.js

      # 실패해도 아래 seen.json 커밋은 반드시 돌아야 한다 (안 그러면 같은 공고가 30분마다 재발송)
      - name: 갱신된 refresh token 되쓰기
        if: always() && steps.run.outputs.new_refresh_token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_TOKEN: ${{ steps.run.outputs.new_refresh_token }}
        run: gh secret set KAKAO_REFRESH_TOKEN --body "$NEW_TOKEN"

      - name: seen.json 커밋
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seen.json
          git diff --cached --quiet || (git commit -m 'chore: update seen.json [skip ci]' && git pull --rebase && git push)
